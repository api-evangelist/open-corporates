aid: open-corporates
name: OpenCorporates
description: >-
  OpenCorporates is the world's largest open database of companies, providing a
  REST API for searching and retrieving company registration data, officer
  information, and corporate filings globally across more than 140 jurisdictions.
  The API enables access to company details, director and officer records,
  statutory filings, and corporate groupings, making it a primary resource for
  compliance, due diligence, investigative journalism, and corporate transparency.
